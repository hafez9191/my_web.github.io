<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>Hafez IoT Panel</title>


<style>

body{

    font-family: Arial;
    background:#111827;
    color:white;
    text-align:center;

}


.card{

    background:#1f2937;
    width:350px;
    margin:50px auto;
    padding:30px;
    border-radius:20px;

}


.value{

    font-size:50px;
    color:#38bdf8;

}


input{

    width:90%;

}


button{

    padding:12px 25px;
    margin:10px;
    font-size:18px;
    border-radius:10px;

}


</style>

</head>


<body>


<h1>
Hafez Control
</h1>


<div class="card">


<h2>
Temperature Sensor
</h2>


<div class="value">

<span id="temp">
25
</span>

°C

</div>



<br>


<input 
type="range"
min="0"
max="100"
value="25"
id="slider">



<p>

Sensor Value

</p>


<button onclick="increase()">

+

</button>


<button onclick="decrease()">

-

</button>


</div>



<script>


let temperature = 25;


let slider = document.getElementById("slider");

let display = document.getElementById("temp");



// وقتی اسلایدر حرکت کرد

slider.oninput = function(){

temperature = this.value;

display.innerHTML = temperature;

}




function increase(){

temperature++;

update();

}



function decrease(){

temperature--;

update();

}



function update(){

display.innerHTML = temperature;

slider.value = temperature;

}



</script>



</body>

</html>
